<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostRun — Operative Invite</title>
  <meta name="description" content="Deploy with me on GhostRun: Real-world GPS tactical pursuit.">
  <meta property="og:title" content="GhostRun — Operative Invite">
  <meta property="og:description" content="Deploy on GhostRun: Real-world GPS tactical multiplayer tag. Connect and join the operative network.">
  <meta property="og:image" content="https://arshvirsk.github.io/GhostRun/assets/icon.png">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0B0D12">
  <style>
    :root {
      --bg: #0B0D12;
      --surface: #13161F;
      --primary: #C7F36B;
      --text: #F9FAFB;
      --text-muted: #9CA3AF;
      --border: #262B36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 380px;
      width: 100%;
      padding: 32px 24px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
    }
    .brand {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      margin: 12px 0 6px;
    }
    .sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: var(--primary);
      color: #000000;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">GHOSTRUN</div>
    <div class="title" id="operativeName">Operative Invite</div>
    <div class="sub">Deploy together on the tactical grid.</div>
    <a href="#" id="openBtn" class="btn">OPEN GHOSTRUN</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const add = params.get('add');
    if (add) {
      document.getElementById('operativeName').textContent = '@' + decodeURIComponent(add);
      const appUrl = 'ghostrun://friends?add=' + encodeURIComponent(add);
      document.getElementById('openBtn').href = appUrl;
      window.location.href = appUrl;
    }
  </script>
</body>
</html>
