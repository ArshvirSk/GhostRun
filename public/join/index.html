<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostRun - Join Mission</title>
  <meta name="description" content="Join your squad on GhostRun: Real-world GPS tactical chase game.">
  <meta property="og:title" content="GhostRun Mission Invite">
  <meta property="og:description" content="Tap to join the tactical grid and play real-world GPS tag.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0B0F19">
  <style>
    :root {
      --bg: #0B0F19;
      --surface: #111827;
      --surface-elevated: #1F2937;
      --primary: #10B981;
      --accent: #06B6D4;
      --text: #F9FAFB;
      --text-muted: #9CA3AF;
      --border: #374151;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
    p.sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .code-box {
      background: var(--surface-elevated);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .code-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1.5px; margin-bottom: 4px; }
    .code-value { font-size: 38px; font-weight: 900; letter-spacing: 6px; color: var(--text); }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: var(--surface-elevated); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #374151; }
    .footer-note { font-size: 12px; color: var(--text-muted); margin-top: 16px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Tactical Match Invite</div>
    <h1>GhostRun</h1>
    <p class="sub">You've been invited to join a real-world GPS match.</p>

    <div class="code-box">
      <div class="code-label">Lobby Code</div>
      <div class="code-value" id="code-display">----</div>
    </div>

    <a href="ghost-run://join" class="btn btn-primary" id="open-app-btn">Open in GhostRun App</a>
    <a href="https://play.google.com/store/apps/details?id=com.ghostrun.app" class="btn btn-secondary">Get the App on Play Store</a>

    <div class="footer-note">
      Already have the app installed? Tap <strong>Open in GhostRun App</strong> or enter the code above in the Join screen.
    </div>
  </div>

  <script>
    (function() {
      // Extract code from path /join/ABCD or query ?code=ABCD
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var codeCandidate = '';
      if (pathParts.length > 0 && pathParts[pathParts.length - 1] !== 'join') {
        codeCandidate = pathParts[pathParts.length - 1];
      }
      if (!codeCandidate) {
        var params = new URLSearchParams(window.location.search);
        codeCandidate = params.get('code') || '';
      }

      var cleanCode = codeCandidate.replace(/[^A-Za-z0-9]/g, '').slice(0, 4).toUpperCase();
      if (cleanCode.length === 4) {
        document.getElementById('code-display').textContent = cleanCode;
        var deepLink = "ghost-run://join?code=" + cleanCode;
        document.getElementById('open-app-btn').setAttribute('href', deepLink);

        // Attempt mobile redirect
        var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile) {
          setTimeout(function() {
            window.location.href = deepLink;
          }, 300);
        }
      }
    })();
  </script>
</body>
</html>
